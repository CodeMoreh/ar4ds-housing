project:
  type: website
  output-dir: _site
  # Anchored to the project root: an unanchored pattern such as `data/` matches
  # every folder of that name at any depth.
  resources:
    - /data/
    - /assets/
  render:
    - "*.qmd"
    - "data/*.md"
    - "tracks/**/*.qmd"
    - "companion/*.qmd"
    - "slides/*.qmd"
    # The live decks of the part-day and full-day formats, whose slides run R in the
    # browser; a folder of their own, because the revealjs key of
    # slides/_metadata.yml would render them twice
    - "live/*.qmd"
    - "!_planning/**"
    # In the repository but out of the build until CM has vetted them (15
    # November 2026): the long format, the four decks of its third day, and
    # the run sheet and the notes on the formats of the facilitator
    - "!tracks/long/**"
    - "!slides/experiments.qmd"
    - "!slides/binary-outcomes.qmd"
    - "!slides/bayesian.qmd"
    - "!slides/report.qmd"
    - "!facilitator/**"

# The docked sidebars of the formats live in their own file.
metadata-files:
  - _sidebar.yml

website:
  title: "AR4DS – Housing and racial bias"
  site-url: "https://codemoreh.github.io/ar4ds-housing/"
  repo-url: "https://github.com/CodeMoreh/ar4ds-housing"
  repo-actions: [issue]
  favicon: assets/logo.png
  # The previous and next links at the foot of each page of a format, in the
  # order of its sidebar
  page-navigation: true
  # Shown at the top of every page while the materials are being revised;
  # delete the block once they are stable. It does not reach the reveal.js
  # decks, which have no site navigation.
  announcement:
    icon: exclamation-triangle
    dismissable: false
    type: warning
    position: above-navbar
    content: "**Under active development.** These course materials are being revised and may change at any time, so please do not rely on them as they currently stand."

  navbar:
    logo: assets/logo.png
    logo-alt: "CM logo"
    left:
      # The formats are reached from the Formats section of the opening page.
      # Each has a docked sidebar (_sidebar.yml), and the navbar item of the
      # format opened last (_includes/track-choice.html) leads back to it from
      # the pages that every format shares.
      - href: index.qmd
        text: Home
      - href: background.qmd
        text: Background
      - text: Multiverse
        menu:
          - href: menu.qmd
            text: "Specification menu"
          - href: curve.qmd
            text: "Specification curve"
          - href: class-results.qmd
            text: "Class results"
      - text: Companion
        menu:
          - href: companion/index.qmd
            text: "Overview"
          - text: "---"
          - text: "Tools"
          # The modules on the tools live on the umbrella site; the helpers of
          # the workspace belong to this case study
          - href: "https://codemoreh.github.io/ar4ds/tools/r.html"
            text: "Getting started with R"
          - href: "https://codemoreh.github.io/ar4ds/tools/r-further.html"
            text: "Getting started with R, part 2"
          - href: "https://codemoreh.github.io/ar4ds/tools/r-functions.html"
            text: "Getting started with R, part 3"
          - href: companion/helpers.qmd
            text: "The helpers of the workspace"
          - href: "https://codemoreh.github.io/ar4ds/tools/ide.html"
            text: "Positron and other IDEs"
          - href: "https://codemoreh.github.io/ar4ds/tools/quarto.html"
            text: "Quarto"
          - href: "https://codemoreh.github.io/ar4ds/git-github.html"
            text: "Git and GitHub"
          - href: "https://codemoreh.github.io/ar4ds/tools/ai.html"
            text: "AI assistants"
          - text: "---"
          - text: "Data and sharing"
          - href: companion/data-sources.qmd
            text: "Social science data sources"
          - href: companion/data-management.qmd
            text: "Building the analysis file"
          - href: companion/repositories.qmd
            text: "Reproducibility repositories"
          - text: "---"
          - text: "Methods"
          - href: companion/experiments.qmd
            text: "Audit experiments"
          - href: companion/subgroups.qmd
            text: "Subgroups and multiple comparisons"
          - href: companion/binary-outcomes.qmd
            text: "Binary outcomes"
          - href: companion/bayesian.qmd
            text: "Bayesian estimation"
          - href: companion/dags.qmd
            text: "Causal graphs and adjustment sets"
          - href: companion/missingness.qmd
            text: "Missing values"
          - href: companion/multiverse.qmd
            text: "The multiverse and its critics"
          - href: companion/meta-analysis.qmd
            text: "Meta-analysis"
      - href: resources.qmd
        text: Resources
    right:
      # The pages that every case study shares live on the umbrella site
      - href: "https://codemoreh.github.io/ar4ds/"
        text: AR4DS

  page-footer:
    left: |
      Content licensed [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/).

filters:
  - highlight-text
  - more-fragments

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    # The format that a visitor last opened, as a navbar item on every page
    include-after-body: _includes/track-choice.html

execute:
  freeze: auto
