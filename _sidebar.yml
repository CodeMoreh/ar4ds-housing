# The docked sidebars of the formats of the Housing case study. Each lists only
# the pages of its own format, in teaching order, and the previous and next
# links at the foot of each page follow that order. The pages under tracks/ and
# this file are edited by hand. The long format, which is out of the build
# (_quarto.yml), has no sidebar until it is built again. The section Tools
# of each sidebar gives absolute addresses, which Quarto treats as external
# links: the pages behind them, the browser lab and the cheatsheet among them,
# show no sidebar, and the previous and next links never run into them.
website:
  sidebar:
    - title: "Short"
      style: docked
      collapse-level: 2
      contents:
        - text: "Overview"
          href: tracks/short/index.qmd
        - text: "Before the session"
          href: tracks/short/before.qmd
        - text: "The exercise"
          href: tracks/short/exercise.qmd
        - text: "First half – The claim and its reproduction"
          href: tracks/short/half-1.qmd
        - text: "Second half – Exploration and replication"
          href: tracks/short/half-2.qmd
        - text: "Slides"
          href: tracks/short/slides.qmd
        - text: "After the session"
          href: tracks/short/after.qmd
        - section: "Tools"
          contents:
            - text: "Browser lab"
              href: "https://codemoreh.github.io/ar4ds-housing/lab.html"
    - title: "Day"
